<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order receipt · LXI Super Ticket</title>
  </head>
  <body style="margin:0;padding:0;background:#eef0f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#111827;">
    <div id="mail-root"></div>
    <script src="order-data.js"></script>
    <script>
      (function () {
        const M = window.LXI_MAIL;
        const order = M.getOrder();
        const passes = M.ensurePasses(order);
        const paidAt = M.fmtDate(order.createdAt);

        document.getElementById("mail-root").innerHTML = `
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef0f3;padding:24px 12px;">
            <tr>
              <td align="center">
                <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="width:560px;max-width:100%;">
                  <tr>
                    <td style="padding:8px 4px 18px;">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                        <tr>
                          <td valign="middle">
                            <img src="../assets/brand/mark-trophy.png" width="28" alt="" style="display:inline-block;border:0;width:28px;height:auto;vertical-align:middle;margin-right:8px;" />
                            <span style="font-size:15px;font-weight:700;color:#111827;vertical-align:middle;">LXI Super Ticket</span>
                          </td>
                          <td align="right" valign="middle" style="font-size:12px;color:#6b7280;font-weight:600;">Email 1 of 2</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="background:#ffffff;border-radius:12px;padding:24px 22px;border:1px solid #e5e7eb;">
                      <p style="margin:0 0 6px;font-size:13px;font-weight:600;color:#059669;">Payment successful</p>
                      <h1 style="margin:0 0 8px;font-size:24px;line-height:1.25;color:#111827;font-weight:700;">Order receipt</h1>
                      <p style="margin:0;font-size:14px;line-height:1.5;color:#4b5563;">
                        Hi ${order.first || "there"} — thanks for your order <strong style="color:#111827;">${order.id}</strong>.
                        Your tickets are arriving in the next email with unique QR codes:
                        ${passes.map((p) => `<strong style="color:#111827;">${p.code}</strong>`).join(", ")}.
                      </p>
                    </td>
                  </tr>
                  <tr><td style="height:14px;">&nbsp;</td></tr>
                  <tr>
                    <td style="background:#ffffff;border-radius:12px;padding:20px 18px;border:1px solid #e5e7eb;">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                        <tr>
                          <td width="50%" valign="top" style="padding-right:10px;">
                            <p style="margin:0 0 6px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;">Billed to</p>
                            <p style="margin:0;font-size:14px;line-height:1.5;color:#111827;">
                              ${order.first || ""} ${order.last || ""}<br />${order.email || ""}<br />${order.city || ""}${order.state ? ", " + order.state : ""}
                            </p>
                          </td>
                          <td width="50%" valign="top">
                            <p style="margin:0 0 6px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;">Payment</p>
                            <p style="margin:0;font-size:14px;line-height:1.5;color:#111827;">
                              ${paidAt}<br />Order ${order.id}<br /><span style="color:#059669;font-weight:700;">Paid</span>
                            </p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr><td style="height:14px;">&nbsp;</td></tr>
                  <tr>
                    <td style="background:#ffffff;border-radius:12px;padding:8px 0;border:1px solid #e5e7eb;overflow:hidden;">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                        <tr>
                          <td style="padding:14px 18px 10px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid #f3f4f6;">Order summary</td>
                        </tr>
                        ${(order.items || [])
                          .map(
                            (item) => `
                          <tr>
                            <td style="padding:16px 18px;border-bottom:1px solid #f3f4f6;">
                              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                                <tr>
                                  <td valign="top">
                                    <p style="margin:0 0 4px;font-size:15px;font-weight:700;color:#111827;">${item.title}</p>
                                    <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.45;">
                                      ${item.venue || ""}<br />
                                      Sec ${item.section} · ${item.zone || "Seat"} · ${item.qty} ticket${item.qty > 1 ? "s" : ""}${item.qty > 1 ? " · Side by side" : ""}
                                    </p>
                                  </td>
                                  <td align="right" valign="top" style="font-size:15px;font-weight:700;color:#111827;white-space:nowrap;">${M.moneyCents(item.price * item.qty)}</td>
                                </tr>
                              </table>
                            </td>
                          </tr>`
                          )
                          .join("")}
                        <tr>
                          <td style="padding:8px 18px 16px;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                              <tr>
                                <td style="padding:8px 0;font-size:14px;color:#6b7280;border-top:1px solid #f3f4f6;">Fees</td>
                                <td align="right" style="padding:8px 0;font-size:14px;color:#059669;border-top:1px solid #f3f4f6;">Included</td>
                              </tr>
                              <tr>
                                <td style="padding:8px 0;font-size:16px;font-weight:700;color:#111827;">Total</td>
                                <td align="right" style="padding:8px 0;font-size:16px;font-weight:700;color:#111827;">${M.moneyCents(order.total)}</td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr><td style="height:16px;">&nbsp;</td></tr>
                  <tr>
                    <td style="padding:0 4px;font-size:12px;line-height:1.5;color:#6b7280;">
                      Ticket IDs for this order: ${passes.map((p) => p.code).join(" · ")}. Each ID is unique and matches the QR on your e-tickets.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>`;
        document.title = `Receipt ${order.id} · LXI Super Ticket`;
      })();
    </script>
  </body>
</html>
