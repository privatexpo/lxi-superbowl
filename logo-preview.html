<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo preview — LXI Super Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090f;
        --card: #10141c;
        --line: rgb(255 255 255 / 0.1);
        --text: #f4f0e8;
        --muted: rgb(255 255 255 / 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Syne, system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 0%, rgb(255 122 24 / 0.12), transparent 40%),
          radial-gradient(circle at 80% 100%, rgb(80 120 255 / 0.1), transparent 35%),
          var(--bg);
        color: var(--text);
        padding: 40px 24px 64px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        letter-spacing: -0.03em;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card figure {
        margin: 0;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        background: #000;
        padding: 18px;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card.wide figure {
        aspect-ratio: 16 / 9;
      }
      .meta {
        padding: 14px 16px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px solid var(--line);
      }
      .meta strong {
        font-size: 15px;
      }
      .meta span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .mock {
        margin-top: 36px;
      }
      .mock h2 {
        margin: 0 0 14px;
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .header-mock {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgb(8 10 16 / 0.85);
        margin-bottom: 12px;
      }
      .header-mock img {
        height: 42px;
        width: auto;
        max-width: 180px;
        object-fit: contain;
      }
      .header-mock em {
        font-style: normal;
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
      }
      .note {
        margin-top: 22px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Aperçu des logos</h1>
      <p class="lead">5 options avec le trophée — dis-moi A, B, C, D ou E.</p>

      <div class="grid">
        <article class="card">
          <figure>
            <img src="assets/logos/logo-option-a-horizontal.png" alt="Option A" />
          </figure>
          <div class="meta">
            <strong>A — Horizontal</strong>
            <span>Wordmark</span>
          </div>
        </article>

        <article class="card">
          <figure>
            <img src="assets/logos/logo-option-b-stacked.png" alt="Option B" />
          </figure>
          <div class="meta">
            <strong>B — Empilé</strong>
            <span>Stacked</span>
          </div>
        </article>

        <article class="card">
          <figure>
            <img src="assets/logos/logo-option-c-badge.png" alt="Option C" />
          </figure>
          <div class="meta">
            <strong>C — Badge</strong>
            <span>Emblème</span>
          </div>
        </article>

        <article class="card wide">
          <figure>
            <img src="assets/logos/logo-option-d-header.png" alt="Option D" />
          </figure>
          <div class="meta">
            <strong>D — Header</strong>
            <span>Barre site</span>
          </div>
        </article>

        <article class="card">
          <figure>
            <img src="assets/logos/logo-option-e-mono.png" alt="Option E" />
          </figure>
          <div class="meta">
            <strong>E — Mono</strong>
            <span>Argent / noir</span>
          </div>
        </article>
      </div>

      <div class="mock">
        <h2>Aperçu dans le header</h2>
        <div class="header-mock">
          <img src="assets/logos/logo-option-a-horizontal.png" alt="" />
          <em>A</em>
        </div>
        <div class="header-mock">
          <img src="assets/logos/logo-option-b-stacked.png" alt="" />
          <em>B</em>
        </div>
        <div class="header-mock">
          <img src="assets/logos/logo-option-c-badge.png" alt="" />
          <em>C</em>
        </div>
        <div class="header-mock">
          <img src="assets/logos/logo-option-d-header.png" alt="" />
          <em>D</em>
        </div>
        <div class="header-mock">
          <img src="assets/logos/logo-option-e-mono.png" alt="" />
          <em>E</em>
        </div>
      </div>

      <p class="note">Réponds avec la lettre (A–E) pour que je l’applique sur le site.</p>
    </div>
  </body>
</html>
